<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>デジタルフォトフレーム</title>

67 45 407 20 387 Z' fill='%23CBA052' stroke='%237D5F25' stroke-width='3'/><path d='M20 492 L105 492 C85 472 40 427 20 407 Z' fill='%23E5C378'/><path d='M492 492 L387 492 C407 467 467 407 492 387 Z' fill='%23CBA052' stroke='%237D5F25' stroke-width='3'/><path d='M492 492 L407 492 C427 472 472 427 492 407 Z' fill='%23E5C378'/></svg>">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body, html { width: 100%; height: 100%; background-color: #000; color: #fff; font-family: sans-serif; overflow: hidden; }
    #setup-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #121212; display: flex; flex-direction: column; align-items: center; padding: 20px; overflow-y: auto; z-index: 100; }
    .card { background: #1e1e1e; border-radius: 16px; padding: 24px; max-width: 600px; width: 100%; border: 1px solid #333; margin-bottom: 30px; }
    h1 { font-size: 1.5rem; margin-bottom: 16px; text-align: center; color: #4da6ff; }
    .btn { display: block; width: 100%; padding: 14px; background: #007bff; color: white; border: none; border-radius: 12px; font-size: 1rem; font-weight: bold; margin-top: 10px; text-align: center; cursor: pointer; }
    .btn-folder { background: #6f42c1; }
    .btn-preview { background: #28a745; }
    .btn-secondary { background: #444; margin-top: 6px; }
    .btn-danger { background: #dc3545; padding: 10px; font-size: 0.9rem; }
    
    .schedule-item { display: flex; align-items: center; justify-content: space-between; background: #252525; padding: 10px; border-radius: 8px; margin-bottom: 8px; gap: 4px; flex-wrap: wrap; }
    .time-picker-group { display: flex; align-items: center; gap: 2px; }
    .time-select { background: #333; color: #fff; border: 1px solid #555; padding: 6px 4px; border-radius: 6px; font-size: 0.9rem; text-align: center; font-weight: bold; }
    
    .day-tabs { display: flex; gap: 4px; margin-bottom: 10px; flex-wrap: wrap; }
    .day-tab { background: #333; color: #aaa; border: 1px solid #555; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 0.85rem; flex: 1; text-align: center; }
    .day-tab.active { background: #007bff; color: #fff; border-color: #007bff; font-weight: bold; }

    .filter-item { display: flex; align-items: center; justify-content: space-between; background: #252525; padding: 8px; border-radius: 8px; margin-bottom: 6px; gap: 6px; flex-wrap: wrap; }
    .filter-item input[type="date"] { background: #333; color: #fff; border: 1px solid #555; padding: 6px; border-radius: 6px; font-size: 0.85rem; flex: 1; min-width: 110px; }
    .filter-item input[type="number"] { background: #333; color: #fff; border: 1px solid #555; padding: 6px; border-radius: 6px; font-size: 0.85rem; width: 60px; text-align: center; }

    #slideshow-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: none; background: #000; z-index: 10; overflow: hidden; cursor: pointer; touch-action: pan-y; }
    .photo-wrapper { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; opacity: 0; transition: opacity 1.5s ease-in-out; }
    .photo-wrapper.active { opacity: 1; z-index: 2; }
    .photo-wrapper.inactive { opacity: 0; z-index: 1; }
    .photo { max-width: 100%; max-height: 100%; object-fit: contain; }

    #date-overlay { position: absolute; bottom: 20px; left: 20px; background: rgba(0,0,0,0.6); color: #fff; padding: 8px 16px; border-radius: 8px; font-size: 1.1rem; z-index: 20; border: 1px solid rgba(255,255,255,0.1); pointer-events: none; }
    #blackout-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 50; display: none; cursor: pointer; }
    #controls { position: absolute; top: 15px; right: 15px; z-index: 30; display: flex; gap: 8px; }
    .ctrl-btn { background: rgba(0,0,0,0.6); color: #fff; border: 1px solid #555; padding: 10px 16px; border-radius: 20px; cursor: pointer; }
    .ctrl-btn-danger { background: rgba(220, 53, 69, 0.8); border-color: #dc3545; }
    input[type="file"] { display: none; }

    #modal-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: none; justify-content: center; align-items: center; z-index: 200; padding: 20px; }
    .modal-card { background: #1e1e1e; border-radius: 16px; width: 100%; max-width: 750px; height: 85vh; display: flex; flex-direction: column; border: 1px solid #333; overflow: hidden; }
    .modal-header { padding: 16px 20px; border-bottom: 1px solid #333; display: flex; justify-content: space-between; align-items: center; }
    
    .modal-toolbar { padding: 10px 20px; border-bottom: 1px solid #333; background: #252525; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-size: 0.85rem; }
    .modal-toolbar select, .modal-toolbar button { background: #333; color: #fff; border: 1px solid #555; padding: 5px 10px; border-radius: 6px; cursor: pointer; }
    .view-btn-group { display: flex; gap: 4px; }
    .view-btn { background: #333; color: #aaa; border: 1px solid #555; padding: 5px 10px; border-radius: 6px; cursor: pointer; }
    .view-btn.active { background: #007bff; color: #fff; border-color: #007bff; font-weight: bold; }

    .modal-body { padding: 20px; overflow-y: auto; flex: 1; }
    .modal-body.grid-view { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 12px; }
    .thumb-item { background: #2a2a2a; border-radius: 8px; overflow: hidden; position: relative; border: 1px solid #444; display: flex; flex-direction: column; align-items: center; height: 140px; flex-shrink: 0; }
    .thumb-item img, .thumb-item video { width: 100%; height: 90px; object-fit: cover; flex-shrink: 0; display: block; background: #111; }
    .thumb-name { font-size: 0.7rem; padding: 2px 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 100%; text-align: center; color: #ccc; height: 22px; flex-shrink: 0; }
    .thumb-del { background: #dc3545; color: #fff; border: none; border-radius: 4px; padding: 2px 8px; font-size: 0.7rem; cursor: pointer; margin-top: 2px; }

    .modal-body.list-view { display: flex; flex-direction: column; gap: 8px; }
    .list-item { background: #2a2a2a; border-radius: 8px; border: 1px solid #444; display: flex; align-items: center; padding: 8px 12px; gap: 12px; }
    .list-item img, .list-item video { width: 50px; height: 50px; object-fit: cover; border-radius: 4px; background: #111; flex-shrink: 0; }
    .list-info { flex: 1; min-width: 0; }
    .list-title { font-size: 0.9rem; font-weight: bold; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .list-sub { font-size: 0.75rem; color: #aaa; margin-top: 2px; }

    .modal-footer { padding: 12px 20px; border-top: 1px solid #333; display: flex; justify-content: space-between; align-items: center; background: #1e1e1e; }
  </style>
</head>
<body>

  <div id="setup-screen">
    <div class="card">
      <h1>🖼️ デジタルフォトフレーム</h1>
      
      <button class="btn btn-folder" onclick="document.getElementById('folder-input').click()">
        📁 フォルダごと選択して一括追加
      </button>
      <input type="file" id="folder-input" webkitdirectory directory multiple onchange="handleFolderSelect(event)">

      <button class="btn" style="background: #007bff;" onclick="document.getElementById('file-input').click()">
        🖼️ 写真・動画ファイルを個別に選択・追加
      </button>
      <input type="file" id="file-input" multiple accept="image/*,video/*" onchange="handleFileSelect(event)">

      <div style="text-align: center; margin: 15px 0;">
        <div style="font-size: 1.1rem; font-weight: bold; color: #4da6ff;">
          現在の登録枚数: <span id="photo-count">0</span> 件
        </div>
        <div id="bg-status" style="font-size: 0.85rem; color: #aaa; margin-top: 4px; min-height: 1.2em;"></div>
      </div>

      <button class="btn btn-secondary" style="background: #17a2b8;" onclick="openPhotoManager()">
        👁️ 登録ファイルの一覧・個別削除
      </button>

      <button class="btn btn-danger" style="margin-top: 10px;" onclick="clearPhotosDB()">
        🗑️ 登録ファイルをすべてリセット
      </button>

      <div style="margin-top: 20px; background: #252525; padding: 12px; border-radius: 8px;">
        <label style="display: block; font-weight: bold; margin-bottom: 6px;">
          🎬 再生するメディア種別
        </label>
        <select id="media-type-filter" style="width: 100%; background: #333; color: #fff; border: 1px solid #555; padding: 8px; border-radius: 6px;" onchange="saveSettings()">
          <option value="all">写真と動画の両方</option>
          <option value="image">写真のみ</option>
          <option value="video">動画のみ</option>
        </select>
      </div>

      <div style="margin-top: 15px; background: #252525; padding: 12px; border-radius: 8px;">
        <label style="display: flex; align-items: center; gap: 8px; font-weight: bold; cursor: pointer;">
          <input type="checkbox" id="video-audio-enable" onchange="saveSettings()">
          🔊 動画の音声を再生する
        </label>
      </div>

      <div style="margin-top: 15px; background: #252525; padding: 12px; border-radius: 8px;">
        <label style="display: block; font-weight: bold; margin-bottom: 6px;">
          ⏱️ 写真1枚の表示時間（秒）
        </label>
        <input type="number" id="display-duration" value="5" min="1" max="300" style="width: 100%; background: #333; color: #fff; border: 1px solid #555; padding: 8px; border-radius: 6px;" onchange="saveSettings()">
      </div>

      <div style="margin-top: 15px; background: #252525; padding: 12px; border-radius: 8px;">
        <label style="display: flex; align-items: center; gap: 8px; font-weight: bold; cursor: pointer; margin-bottom: 8px;">
          <input type="checkbox" id="random-enable" onchange="saveSettings()">
          🔀 ランダムに再生する
        </label>
        <div style="margin-top: 10px; padding-left: 20px;">
          <label style="font-size: 0.85rem; color: #aaa; display: block; margin-bottom: 8px;">📅 撮影期間フィルター・表示割合設定（比率）</label>
          <div id="filter-date-list"></div>
          <button class="btn btn-secondary" style="font-size: 0.85rem; padding: 8px; margin-top: 8px;" onclick="addFilterDateSlot()">
            ＋ 撮影期間を追加
          </button>
        </div>
      </div>

      <div style="margin-top: 15px; background: #252525; padding: 12px; border-radius: 8px;">
        <label style="display: flex; align-items: center; gap: 8px; font-weight: bold; cursor: pointer;">
          <input type="checkbox" id="schedule-enable" onchange="toggleScheduleUI(); saveSettings();">
          ⏰ 曜日別・動作時間帯を指定する（自動消灯）
        </label>
        
        <div id="schedule-controls" style="display: none; margin-top: 12px;">
          <div class="day-tabs">
            <button type="button" class="day-tab active" onclick="switchDayTab(0)">日</button>
            <button type="button" class="day-tab" onclick="switchDayTab(1)">月</button>
            <button type="button" class="day-tab" onclick="switchDayTab(2)">火</button>
            <button type="button" class="day-tab" onclick="switchDayTab(3)">水</button>
            <button type="button" class="day-tab" onclick="switchDayTab(4)">木</button>
            <button type="button" class="day-tab" onclick="switchDayTab(5)">金</button>
            <button type="button" class="day-tab" onclick="switchDayTab(6)">土</button>
          </div>
          <div id="schedule-list"></div>
          <button class="btn btn-secondary" style="font-size: 0.85rem; padding: 8px; margin-top: 8px;" onclick="addScheduleSlot()">
            ＋ この曜日に時間帯を追加
          </button>
        </div>
      </div>

      <button class="btn btn-preview" style="margin-top: 24px; font-size: 1.1rem;" onclick="startSlideshow()">
        ▶ スライドショーを開始
      </button>
    </div>
  </div>

  <div id="modal-screen">
    <div class="modal-card">
      <div class="modal-header">
        <h3>📷 登録ファイルの管理 (<span id="manager-count">0</span>件)</h3>
        <button class="btn btn-danger" style="width: auto; padding: 6px 14px; margin: 0;" onclick="closePhotoManager()">閉じる</button>
      </div>

      <div class="modal-toolbar">
        <div class="view-btn-group">
          <button id="view-btn-grid" class="view-btn active" onclick="switchManagerView('grid')">🖼️ サムネイル</button>
          <button id="view-btn-list" class="view-btn" onclick="switchManagerView('list')">📄 リスト</button>
        </div>
        <div style="margin-left: auto; display: flex; gap: 6px; align-items: center;">
          <label>並べ替え:</label>
          <select id="sort-key" onchange="changeSortConfig()">
            <option value="timestamp">撮影日順</option>
            <option value="name">ファイル名順</option>
            <option value="id">アップロード順</option>
          </select>
          <select id="sort-order" onchange="changeSortConfig()">
            <option value="asc">昇順 ⬆️</option>
            <option value="desc">降順 ⬇️</option>
          </select>
        </div>
      </div>

      <div class="modal-body grid-view" id="thumbnail-container"></div>

      <div class="modal-footer">
        <button class="btn btn-secondary" style="width: auto; padding: 6px 14px; margin: 0;" onclick="changeManagerPage(-1)">◀ 前へ</button>
        <span id="page-indicator" style="font-size: 0.9rem; color: #ccc;">1 / 1</span>
        <button class="btn btn-secondary" style="width: auto; padding: 6px 14px; margin: 0;" onclick="changeManagerPage(1)">次へ ▶</button>
      </div>
    </div>
  </div>

  <div id="slideshow-screen">
    <div id="photo-container" style="position: relative; width: 100%; height: 100%;"></div>
    <div id="date-overlay">----/--/-- --:--</div>
    
    <div id="controls">
      <button class="ctrl-btn ctrl-btn-danger" onclick="deleteCurrentPhoto(event)">🗑️ この写真を削除</button>
      <button class="ctrl-btn" onclick="toggleFullscreen()">全画面切替</button>
      <button class="ctrl-btn" onclick="stopSlideshow()">設定画面へ</button>
    </div>
  </div>

  <div id="blackout-screen" onclick="stopSlideshow()"></div>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        const swCode = `
          self.addEventListener('install', (e) => self.skipWaiting());
          self.addEventListener('activate', (e) => self.clients.claim());
          self.addEventListener('fetch', (e) => {
            e.respondWith(fetch(e.request).catch(() => caches.match(e.request)));
          });
        `;
        const blob = new Blob([swCode], { type: 'text/javascript' });
        const swUrl = URL.createObjectURL(blob);
        navigator.serviceWorker.register(swUrl).catch(err => console.log('SW Reg failed:', err));
      });
    }

    let photoMetaList = []; 
    let currentIndex = 0;
    let timer = null;
    let currentDayTab = 0;
    const defaultSchedules = {
      0: [{ start: "08:00", end: "22:00" }],
      1: [{ start: "08:00", end: "22:00" }],
      2: [{ start: "08:00", end: "22:00" }],
      3: [{ start: "08:00", end: "22:00" }],
      4: [{ start: "08:00", end: "22:00" }],
      5: [{ start: "08:00", end: "22:00" }],
      6: [{ start: "08:00", end: "22:00" }]
    };
    let schedulesByDay = JSON.parse(JSON.stringify(defaultSchedules));
    let filterDateRanges = [];
    let otherDateRatio = 1;
    let db = null;
    let managerPage = 1;
    const ITEMS_PER_PAGE = 40;
    let currentObjectUrl = null;
    let currentPlayingPhotoId = null;

    let managerViewMode = 'grid';
    let managerSortKey = 'timestamp';
    let managerSortOrder = 'asc';

    // スワイプ操作用変数
    let touchStartX = 0;
    let touchStartY = 0;

    const request = indexedDB.open("PhotoFrameDB", 13);
    request.onupgradeneeded = (e) => {
      db = e.target.result;
      if (!db.objectStoreNames.contains("photos")) {
        db.createObjectStore("photos", { keyPath: "id", autoIncrement: true });
      }
      if (!db.objectStoreNames.contains("settings")) {
        db.createObjectStore("settings");
      }
    };
    request.onsuccess = (e) => {
      db = e.target.result;
      loadPhotosMetadataFromDB();
      loadSettings();
    };

    function generateHourOptionsHTML(selectedHour) {
      let html = '';
      for (let h = 0; h < 24; h++) {
        const hh = String(h).padStart(2, '0');
        const isSelected = hh === selectedHour ? 'selected' : '';
        html += `<option value="${hh}" ${isSelected}>${hh}時</option>`;
      }
      return html;
    }

    function generateMinOptionsHTML(selectedMin) {
      let html = '';
      for (let m = 0; m < 60; m++) {
        const mm = String(m).padStart(2, '0');
        const isSelected = mm === selectedMin ? 'selected' : '';
        html += `<option value="${mm}" ${isSelected}>${mm}分</option>`;
      }
      return html;
    }

    function updateScheduleTime(day, idx, type, hOrM, value) {
      let currentVal = schedulesByDay[day][idx][type] || "08:00";
      let [h, m] = currentVal.split(':');
      if (hOrM === 'h') h = value;
      if (hOrM === 'm') m = value;
      schedulesByDay[day][idx][type] = `${h}:${m}`;
      saveSettings();
    }

    function compressImage(file) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let width = img.width;
            let height = img.height;
            const MAX_DIM = 1920;

            if (width > height && width > MAX_DIM) {
              height = Math.round((height * MAX_DIM) / width);
              width = MAX_DIM;
            } else if (height > MAX_DIM) {
              width = Math.round((width * MAX_DIM) / height);
              height = MAX_DIM;
            }

            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);

            canvas.toBlob((blob) => {
              resolve(blob || file);
            }, 'image/jpeg', 0.85);
          };
          img.onerror = () => resolve(file);
          img.src = e.target.result;
        };
        reader.onerror = () => resolve(file);
        reader.readAsDataURL(file);
      });
    }

    function saveBlobToDB(blob, name, size, timestamp, isVideo, callback) {
      if (!db) return;
      const tx = db.transaction("photos", "readwrite");
      const store = tx.objectStore("photos");
      const req = store.add({ blob, name, size, timestamp: timestamp || Date.now(), isVideo: !!isVideo });
      req.onsuccess = (e) => {
        if (callback) callback(e.target.result);
      };
    }

    function deletePhotoFromDB(id, callback) {
      if (!db) return;
      const tx = db.transaction("photos", "readwrite");
      const store = tx.objectStore("photos");
      const req = store.delete(id);
      req.onsuccess = () => {
        if (callback) callback();
      };
    }

    function clearPhotosDB() {
      if (!db) return;
      if (!confirm("登録されているファイルをすべて削除しますか？")) return;
      const tx = db.transaction("photos", "readwrite");
      tx.objectStore("photos").clear();
      photoMetaList = [];
      document.getElementById('photo-count').innerText = 0;
      document.getElementById('bg-status').innerText = "";
      alert("ファイルをすべてリセットしました。");
    }

    function loadPhotosMetadataFromDB() {
      if (!db) return;
      const tx = db.transaction("photos", "readonly");
      const store = tx.objectStore("photos");
      const requestAll = store.openCursor();
      photoMetaList = [];

      requestAll.onsuccess = (e) => {
        const cursor = e.target.result;
        if (cursor) {
          const record = cursor.value;
          const id = cursor.key;
          const fileTimestamp = record.timestamp || Date.now();
          const date = new Date(fileTimestamp);
          const dateStr = `${date.getFullYear()}/${String(date.getMonth()+1).padStart(2,'0')}/${String(date.getDate()).padStart(2,'0')} ${String(date.getHours()).padStart(2,'0')}:${String(date.getMinutes()).padStart(2,'0')}`;
          
          photoMetaList.push({
            id,
            name: record.name,
            size: record.size,
            timestamp: fileTimestamp,
            dateText: dateStr,
            isVideo: !!record.isVideo
          });
          cursor.continue();
        } else {
          document.getElementById('photo-count').innerText = photoMetaList.length;
        }
      };
    }

    function getBlobFromDB(id) {
      return new Promise((resolve) => {
        if (!db) { resolve(null); return; }
        const tx = db.transaction("photos", "readonly");
        const store = tx.objectStore("photos");
        const req = store.get(id);
        req.onsuccess = (e) => {
          const record = e.target.result;
          resolve(record ? record.blob : null);
        };
        req.onerror = () => resolve(null);
      });
    }

    function saveSettings() {
      const scheduleEnabled = document.getElementById('schedule-enable').checked;
      const randomEnabled = document.getElementById('random-enable').checked;
      const displayDuration = document.getElementById('display-duration').value;
      const mediaType = document.getElementById('media-type-filter').value;
      const videoAudioEnabled = document.getElementById('video-audio-enable').checked;

      localStorage.setItem('schedule_enabled', scheduleEnabled);
      localStorage.setItem('random_enabled', randomEnabled);
      localStorage.setItem('display_duration', displayDuration);
      localStorage.setItem('media_type_filter', mediaType);
      localStorage.setItem('video_audio_enabled', videoAudioEnabled);
      localStorage.setItem('filter_date_ranges', JSON.stringify(filterDateRanges));
      localStorage.setItem('other_date_ratio', otherDateRatio);
      localStorage.setItem('schedules_by_day', JSON.stringify(schedulesByDay));

      if (db && db.objectStoreNames.contains("settings")) {
        const tx = db.transaction("settings", "readwrite");
        const store = tx.objectStore("settings");
        store.put(schedulesByDay, "schedules_by_day");
        store.put(scheduleEnabled, "schedule_enabled");
        store.put(randomEnabled, "random_enabled");
        store.put(displayDuration, "display_duration");
        store.put(mediaType, "media_type_filter");
        store.put(videoAudioEnabled, "video_audio_enabled");
        store.put(filterDateRanges, "filter_date_ranges");
        store.put(otherDateRatio, "other_date_ratio");
      }
    }

    function loadSettings() {
      const applySettingsUI = () => {
        switchDayTab(currentDayTab);
        toggleScheduleUI();
      };

      if (db && db.objectStoreNames.contains("settings")) {
        const tx = db.transaction("settings", "readonly");
        const store = tx.objectStore("settings");
        const req = store.get("schedules_by_day");

        req.onsuccess = (e) => {
          const loadedSchedules = e.target.result;
          if (loadedSchedules && typeof loadedSchedules === 'object') {
            schedulesByDay = loadedSchedules;
          } else {
            loadSettingsFromLocalStorage();
          }

          store.get("schedule_enabled").onsuccess = (ev) => {
            if (ev.target.result !== undefined) document.getElementById('schedule-enable').checked = ev.target.result;
            else document.getElementById('schedule-enable').checked = localStorage.getItem('schedule_enabled') === 'true';
          };
          store.get("random_enabled").onsuccess = (ev) => {
            if (ev.target.result !== undefined) document.getElementById('random-enable').checked = ev.target.result;
            else document.getElementById('random-enable').checked = localStorage.getItem('random_enabled') === 'true';
          };
          store.get("display_duration").onsuccess = (ev) => {
            if (ev.target.result !== undefined) document.getElementById('display-duration').value = ev.target.result;
            else document.getElementById('display-duration').value = localStorage.getItem('display_duration') || '5';
          };
          store.get("media_type_filter").onsuccess = (ev) => {
            if (ev.target.result !== undefined) document.getElementById('media-type-filter').value = ev.target.result;
            else document.getElementById('media-type-filter').value = localStorage.getItem('media_type_filter') || 'all';
          };
          store.get("video_audio_enabled").onsuccess = (ev) => {
            if (ev.target.result !== undefined) document.getElementById('video-audio-enable').checked = ev.target.result;
            else document.getElementById('video-audio-enable').checked = localStorage.getItem('video_audio_enabled') === 'true';
          };
          store.get("filter_date_ranges").onsuccess = (ev) => {
            if (ev.target.result !== undefined) filterDateRanges = ev.target.result;
            else {
              const savedRanges = localStorage.getItem('filter_date_ranges');
              if (savedRanges) try { filterDateRanges = JSON.parse(savedRanges); } catch(err) { filterDateRanges = []; }
            }
            renderFilterDateList();
          };
          store.get("other_date_ratio").onsuccess = (ev) => {
            if (ev.target.result !== undefined) otherDateRatio = ev.target.result;
            else {
              const savedOtherRatio = localStorage.getItem('other_date_ratio');
              if (savedOtherRatio !== null) otherDateRatio = parseFloat(savedOtherRatio) || 0;
            }
            renderFilterDateList();
            applySettingsUI();
          };
        };
        req.onerror = () => {
          loadSettingsFromLocalStorage();
          applySettingsUI();
        };
      } else {
        loadSettingsFromLocalStorage();
        applySettingsUI();
      }
    }

    function loadSettingsFromLocalStorage() {
      const scheduleEnabled = localStorage.getItem('schedule_enabled') === 'true';
      const randomEnabled = localStorage.getItem('random_enabled') === 'true';
      const displayDuration = localStorage.getItem('display_duration') || '5';
      const mediaType = localStorage.getItem('media_type_filter') || 'all';
      const videoAudioEnabled = localStorage.getItem('video_audio_enabled') === 'true';

      document.getElementById('schedule-enable').checked = scheduleEnabled;
      document.getElementById('random-enable').checked = randomEnabled;
      document.getElementById('display-duration').value = displayDuration;
      document.getElementById('media-type-filter').value = mediaType;
      document.getElementById('video-audio-enable').checked = videoAudioEnabled;
      
      const savedRanges = localStorage.getItem('filter_date_ranges');
      if (savedRanges) {
        try { filterDateRanges = JSON.parse(savedRanges); } catch(e) { filterDateRanges = []; }
      }
      const savedOtherRatio = localStorage.getItem('other_date_ratio');
      if (savedOtherRatio !== null) {
        otherDateRatio = parseFloat(savedOtherRatio) || 0;
      }
      renderFilterDateList();

      const savedSchedules = localStorage.getItem('schedules_by_day');
      if (savedSchedules) {
        try {
          const loaded = JSON.parse(savedSchedules);
          if (loaded && typeof loaded === 'object') {
            schedulesByDay = loaded;
          }
        } catch(e) {
          schedulesByDay = JSON.parse(JSON.stringify(defaultSchedules));
        }
      }

      for (let i = 0; i < 7; i++) {
        if (!schedulesByDay[i] || !Array.isArray(schedulesByDay[i]) || schedulesByDay[i].length === 0) {
          schedulesByDay[i] = JSON.parse(JSON.stringify(defaultSchedules[i]));
        }
      }
    }

    function renderFilterDateList() {
      const container = document.getElementById('filter-date-list');
      container.innerHTML = '';

      if (filterDateRanges.length === 0) {
        container.innerHTML = '<div style="font-size: 0.85rem; color: #888; padding: 4px 0;">期間指定なし（すべてのファイルが対象）</div>';
        return;
      }

      filterDateRanges.forEach((range, idx) => {
        const div = document.createElement('div');
        div.className = 'filter-item';
        div.innerHTML = `
          <input type="date" value="${range.start || ''}" onchange="filterDateRanges[${idx}].start = this.value; saveSettings();">
          <span style="font-size: 0.85rem; color: #aaa;">〜</span>
          <input type="date" value="${range.end || ''}" onchange="filterDateRanges[${idx}].end = this.value; saveSettings();">
          <span style="font-size: 0.8rem; color: #aaa; margin-left: 4px;">割合:</span>
          <input type="number" min="0" step="0.1" value="${range.ratio !== undefined ? range.ratio : 1}" onchange="filterDateRanges[${idx}].ratio = parseFloat(this.value) || 0; saveSettings();">
          <button class="btn btn-danger" style="padding: 6px 10px; width: auto; font-size: 0.8rem;" onclick="removeFilterDateSlot(${idx})">削除</button>
        `;
        container.appendChild(div);
      });

      const otherDiv = document.createElement('div');
      otherDiv.className = 'filter-item';
      otherDiv.style.background = '#1b2631';
      otherDiv.innerHTML = `
        <span style="font-size: 0.85rem; color: #4da6ff; flex: 1;">上記以外のその他の期間</span>
        <span style="font-size: 0.8rem; color: #aaa;">割合:</span>
        <input type="number" min="0" step="0.1" value="${otherDateRatio}" onchange="otherDateRatio = parseFloat(this.value) || 0; saveSettings();">
      `;
      container.appendChild(otherDiv);

      saveSettings();
    }

    function addFilterDateSlot() {
      if (filterDateRanges.length === 0) {
        otherDateRatio = 0;
      }
      filterDateRanges.push({ start: "", end: "", ratio: 1 });
      renderFilterDateList();
    }

    function removeFilterDateSlot(idx) {
      filterDateRanges.splice(idx, 1);
      if (filterDateRanges.length === 0) {
        otherDateRatio = 1;
      }
      renderFilterDateList();
    }

    function switchDayTab(dayIndex) {

    function handleFolderSelect(e) {

      e.target.value = '';
    }

    function handleFileSelect(e) {
      const files = Array.from(e.target.files);
      if (files.length === 0) return;
      runBackgroundProcessing(files);
      e.target.value = '';
    }

    async function runBackgroundProcessing(files) {
      const statusEl = document.getElementById('bg-status');
      let successCount = 0;
      let skippedCount = 0;
      let totalFiles = files.length;
      let processed = 0;

      for (const file of files) {
        processed++;
        const isImage = file.type.startsWith('image/') || /\.(jpe?g|png|webp|gif)$/i.test(file.name);
        const isVideo = file.type.startsWith('video/') || /\.(mp4|webm|ogg|mov)$/i.test(file.name);
        const isNotMac = !file.webkitRelativePath || !file.webkitRelativePath.includes('__MACOSX');

        if ((isImage || isVideo) && isNotMac) {
          const isDuplicate = photoMetaList.some(p => p.name === file.name && p.size === file.size);
          if (isDuplicate) {
            skippedCount++;
            continue;
          }

          statusEl.innerText = `バックグラウンド読込中: ${processed} / ${totalFiles} 件目...`;
          const fileTimestamp = file.lastModified || Date.now();
          try {
            let blobToSave = file;
            if (isImage) {
              blobToSave = await compressImage(file);
            }

            if (photoMetaList.some(p => p.name === file.name && p.size === blobToSave.size)) {
              skippedCount++;
              continue;
            }

            await new Promise((resolve) => {
              saveBlobToDB(blobToSave, file.name, blobToSave.size, fileTimestamp, isVideo, (newId) => {
                const date = new Date(fileTimestamp);
                const dateStr = `${date.getFullYear()}/${String(date.getMonth()+1).padStart(2,'0')}/${String(date.getDate()).padStart(2,'0')} ${String(date.getHours()).padStart(2,'0')}:${String(date.getMinutes()).padStart(2,'0')}`;
                photoMetaList.push({ id: newId, name: file.name, size: blobToSave.size, timestamp: fileTimestamp, dateText: dateStr, isVideo });
                document.getElementById('photo-count').innerText = photoMetaList.length;
                resolve();
              });
            });
            successCount++;
          } catch (err) {
            console.error("File process error:", err);
          }
        }
        if (processed % 3 === 0) {
          await new Promise(r => setTimeout(r, 4));
        }
      }

      let msg = `✅ 追加完了！ (${successCount}件追加)`;
      if (skippedCount > 0) {
        msg += ` ※重複した${skippedCount}件を除外しました`;
      }
      statusEl.innerText = msg;
      setTimeout(() => {
        if (statusEl.innerText.includes('追加完了')) statusEl.innerText = '';
      }, 5000);
    }

    function openPhotoManager() {
      managerPage = 1;
      renderPhotoManager();
      document.getElementById('modal-screen').style.display = 'flex';
    }

    function switchManagerView(mode) {
      managerViewMode = mode;
      document.getElementById('view-btn-grid').classList.toggle('active', mode === 'grid');
      document.getElementById('view-btn-list').classList.toggle('active', mode === 'list');
      
      const container = document.getElementById('thumbnail-container');
      container.className = `modal-body ${mode}-view`;
      
      renderPhotoManager();
    }

    function changeSortConfig() {
      managerSortKey = document.getElementById('sort-key').value;
      managerSortOrder = document.getElementById('sort-order').value;
      managerPage = 1;
      renderPhotoManager();
    }

    function getSortedPhotoList() {
      const list = [...photoMetaList];
      list.sort((a, b) => {
        let valA = a[managerSortKey];
        let valB = b[managerSortKey];

        if (typeof valA === 'string') {
          const cmp = valA.localeCompare(valB, 'ja', { numeric: true });
          return managerSortOrder === 'asc' ? cmp : -cmp;
        } else {
          return managerSortOrder === 'asc' ? valA - valB : valB - valA;
        }
      });
      return list;
    }

    function changeManagerPage(direction) {
      const maxPage = Math.ceil(photoMetaList.length / ITEMS_PER_PAGE) || 1;
      managerPage += direction;
      if (managerPage < 1) managerPage = 1;
      if (managerPage > maxPage) managerPage = maxPage;
      renderPhotoManager();
    }

    async function renderPhotoManager() {
      const container = document.getElementById('thumbnail-container');
      container.innerHTML = '';
      document.getElementById('manager-count').innerText = photoMetaList.length;

      if (photoMetaList.length === 0) {
        container.innerHTML = '<div style="grid-column: 1/-1; text-align: center; color: #888; padding: 40px;">登録されているファイルはありません</div>';
        document.getElementById('page-indicator').innerText = '1 / 1';
        return;
      }

      const sortedList = getSortedPhotoList();

      const maxPage = Math.ceil(sortedList.length / ITEMS_PER_PAGE);
      if (managerPage > maxPage) managerPage = maxPage;

      document.getElementById('page-indicator').innerText = `${managerPage} / ${maxPage}`;

      const start = (managerPage - 1) * ITEMS_PER_PAGE;
      const end = start + ITEMS_PER_PAGE;
      const pageItems = sortedList.slice(start, end);

      for (const meta of pageItems) {
        const div = document.createElement('div');
        
        if (managerViewMode === 'grid') {
          div.className = 'thumb-item';
          div.id = `thumb-box-${meta.id}`;
          div.innerHTML = `
            <div class="thumb-name" title="${meta.name}">${meta.name}</div>
            <button class="thumb-del" onclick="deletePhoto(${meta.id})">削除</button>
          `;
        } else {
          div.className = 'list-item';
          div.id = `thumb-box-${meta.id}`;
          div.innerHTML = `
            <div class="list-info">
              <div class="list-title" title="${meta.name}">${meta.name}</div>
              <div class="list-sub">${meta.isVideo ? '🎥 動画' : '📷 写真'} | 撮影日: ${meta.dateText}</div>
            </div>
            <button class="thumb-del" style="padding: 6px 12px; font-size: 0.8rem;" onclick="deletePhoto(${meta.id})">削除</button>
          `;
        }
        
        container.appendChild(div);

        const blob = await getBlobFromDB(meta.id);
        if (blob) {
          const url = URL.createObjectURL(blob);
          if (meta.isVideo) {
            const video = document.createElement('video');
            video.src = url;
            video.muted = true;
            video.onloadeddata = () => URL.revokeObjectURL(url);
            div.insertBefore(video, div.firstChild);
          } else {
            const img = document.createElement('img');
            img.src = url;
            img.alt = meta.name;
            img.loading = 'lazy';
            img.onload = () => URL.revokeObjectURL(url);
            div.insertBefore(img, div.firstChild);
          }
        }
      }
    }

    function closePhotoManager() {
      document.getElementById('modal-screen').style.display = 'none';
      document.getElementById('photo-count').innerText = photoMetaList.length;
    }

    function deletePhoto(id) {
      deletePhotoFromDB(id, () => {
        photoMetaList = photoMetaList.filter(p => p.id !== id);
        renderPhotoManager();
        document.getElementById('photo-count').innerText = photoMetaList.length;
      });
    }

    function deleteCurrentPhoto(e) {
      if (e) e.stopPropagation();
      if (!currentPlayingPhotoId) return;

      if (confirm("表示中の写真を削除しますか？")) {
        const targetId = currentPlayingPhotoId;
        deletePhotoFromDB(targetId, () => {
          photoMetaList = photoMetaList.filter(p => p.id !== targetId);
          document.getElementById('photo-count').innerText = photoMetaList.length;
          
          const playableList = getFilteredPlayableList();
          if (!playableList.length) {
            alert("再生可能なファイルが無くなったため設定画面に戻ります。");
            stopSlideshow();
          } else {
            showNextPhoto();
          }
        });
      }
    }

    function isPhotoInRange(photoTime, range) {
      if (!range || (!range.start && !range.end)) return true;
      const d = new Date(photoTime);
      if (isNaN(d.getTime())) return false;
      const photoDateStr = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
      if (range.start && photoDateStr < range.start) return false;
      if (range.end && photoDateStr > range.end) return false;
      return true;
    }

    function getFilteredPlayableList() {
      const mediaType = document.getElementById('media-type-filter').value;
      let list = photoMetaList.filter(item => {
        if (mediaType === 'image') return !item.isVideo;
        if (mediaType === 'video') return item.isVideo;
        return true;
      });

      const validRanges = filterDateRanges.filter(r => r.start || r.end);
      if (validRanges.length > 0) {
        list = list.filter(item => {
          const matchedRangeIdx = validRanges.findIndex(r => isPhotoInRange(item.timestamp, r));
          if (matchedRangeIdx !== -1) {
            const ratio = validRanges[matchedRangeIdx].ratio !== undefined ? validRanges[matchedRangeIdx].ratio : 1;
            return ratio > 0;
          } else {
            return otherDateRatio > 0;
          }
        });
      }

      return list;
    }

    function startSlideshow() {
      const playableList = getFilteredPlayableList();
      if (!playableList.length) return alert('条件に合う再生可能なファイルが見つかりません');
      document.getElementById('setup-screen').style.display = 'none';
      document.getElementById('slideshow-screen').style.display = 'block';
      currentIndex = 0;
      
      if (document.documentElement.requestFullscreen) {
        document.documentElement.requestFullscreen().catch(err => {});
      }

      const container = document.getElementById('photo-container');
      container.innerHTML = '';
      
      showNextPhoto();
    }

    function resetTimer() {
      if (timer) clearTimeout(timer);
      let durationSec = parseInt(document.getElementById('display-duration').value, 10) || 5;
      if (durationSec < 1) durationSec = 1;
      timer = setTimeout(checkScheduleAndNext, durationSec * 1000);
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        if (document.documentElement.requestFullscreen) {
          document.documentElement.requestFullscreen().catch(err => {});
        }
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen().catch(err => {});
        }
      }
    }

    document.addEventListener('fullscreenchange', () => {
      const controls = document.getElementById('controls');
      if (document.fullscreenElement) {
        controls.style.display = 'none';
      } else {
        controls.style.display = 'flex';
      }
    });

    // スライドショー画面のタッチイベント（スワイプ検出と全画面切り替え）
    const slideshowScreen = document.getElementById('slideshow-screen');

    slideshowScreen.addEventListener('touchstart', (e) => {
      if (e.target.closest('#controls')) return;
      touchStartX = e.touches[0].clientX;
      touchStartY = e.touches[0].clientY;
    }, { passive: true });

    slideshowScreen.addEventListener('touchend', (e) => {
      if (e.target.closest('#controls')) return;
      const touchEndX = e.changedTouches[0].clientX;
      const touchEndY = e.changedTouches[0].clientY;
      
      const diffX = touchEndX - touchStartX;
      const diffY = touchEndY - touchStartY;

      // 横スワイプ判定 (50px以上の移動 かつ 縦方向より横方向の移動が大きい場合)
      if (Math.abs(diffX) > 50 && Math.abs(diffX) > Math.abs(diffY)) {
        if (diffX < 0) {
          // 左スワイプ -> 次へ
          checkScheduleAndNext();
        } else {
          // 右スワイプ -> 前へ
          showPrevPhoto();
        }
      } else if (Math.abs(diffX) < 10 && Math.abs(diffY) < 10) {
        // スワイプではなくタップの場合
        if (document.fullscreenElement) {
          if (document.exitFullscreen) {
            document.exitFullscreen().catch(err => {});
          }
        }
      }
    }, { passive: true });

    function showPrevPhoto() {
      const playableList = getFilteredPlayableList();
      if (!playableList.length) return;
      
      const isRandom = document.getElementById('random-enable').checked;
      if (isRandom) {
        // ランダムモード時はランダムに切り替え
        showNextPhoto();
      } else {
        // 順番再生時は1つ前のインデックスへ戻る
        let currentIdx = playableList.findIndex(item => item.id === currentPlayingPhotoId);
        if (currentIdx === -1) currentIdx = 0;
        
        let prevIndex = (currentIdx - 1 + playableList.length) % playableList.length;
        currentIndex = prevIndex;
        renderMediaAtIndex(prevIndex);
      }
    }

    async function renderMediaAtIndex(index) {
      const playableList = getFilteredPlayableList();
      if (!playableList.length) return;
      if (timer) clearTimeout(timer);

      const meta = playableList[index];
      currentPlayingPhotoId = meta.id;

      const blob = await getBlobFromDB(meta.id);
      if (!blob) return;

      if (currentObjectUrl) {
        URL.revokeObjectURL(currentObjectUrl);
      }
      currentObjectUrl = URL.createObjectURL(blob);

      const container = document.getElementById('photo-container');

      const oldWrappers = container.querySelectorAll('.photo-wrapper.active');
      oldWrappers.forEach(w => {
        w.classList.remove('active');
        w.classList.add('inactive');
        setTimeout(() => w.remove(), 1600);
      });

      const wrapper = document.createElement('div');
      wrapper.className = 'photo-wrapper';
      
      if (meta.isVideo) {
        const video = document.createElement('video');
        video.src = currentObjectUrl;
        video.className = 'photo';
        video.autoplay = true;
        
        const audioEnabled = document.getElementById('video-audio-enable').checked;
        video.muted = !audioEnabled;
        
        video.playsInline = true;
        video.onended = () => {
          checkScheduleAndNext();
        };
        video.onerror = () => {
          resetTimer();
        };
        wrapper.appendChild(video);
      } else {
        const img = document.createElement('img');
        img.src = currentObjectUrl; 
        img.className = 'photo';
        wrapper.appendChild(img);
        resetTimer();
      }

      container.appendChild(wrapper);

      setTimeout(() => wrapper.classList.add('active'), 50);

      document.getElementById('date-overlay').innerText = meta.dateText;
    }

    async function showNextPhoto() {
      const playableList = getFilteredPlayableList();
      if (!playableList.length) return;

      const isRandom = document.getElementById('random-enable').checked;
      const validRanges = filterDateRanges.filter(r => r.start || r.end);

      let nextIndex = currentIndex;

      if (isRandom) {
        if (validRanges.length > 0) {
          let groups = [];

          validRanges.forEach(range => {
            const list = playableList.filter(item => isPhotoInRange(item.timestamp, range));
            const ratio = range.ratio !== undefined ? range.ratio : 1;
            if (list.length > 0 && ratio > 0) {
              groups.push({ list, weight: ratio });
            }
          });

          const otherList = playableList.filter(item => {
            return !validRanges.some(range => isPhotoInRange(item.timestamp, range));
          });
          if (otherList.length > 0 && otherDateRatio > 0) {
            groups.push({ list: otherList, weight: otherDateRatio });
          }

          if (groups.length > 0) {
            const totalWeight = groups.reduce((sum, g) => sum + g.weight, 0);
            let rand = Math.random() * totalWeight;
            let selectedGroup = groups[0];

            for (const g of groups) {
              if (rand < g.weight) {
                selectedGroup = g;
                break;
              }
              rand -= g.weight;
            }

            const chosenItem = selectedGroup.list[Math.floor(Math.random() * selectedGroup.list.length)];
            nextIndex = playableList.findIndex(item => item.id === chosenItem.id);
          } else {
            nextIndex = Math.floor(Math.random() * playableList.length);
          }
        } else {
          if (playableList.length > 1) {
            let currentIdx = playableList.findIndex(item => item.id === currentPlayingPhotoId);
            let newIndex;
            do {
              newIndex = Math.floor(Math.random() * playableList.length);
            } while (newIndex === currentIdx && playableList.length > 1);
            nextIndex = newIndex;
          } else {
            nextIndex = 0;
          }
        }
      } else {
        let currentIdx = playableList.findIndex(item => item.id === currentPlayingPhotoId);
        if (currentIdx === -1) {
          nextIndex = 0;
        } else {
          nextIndex = (currentIdx + 1) % playableList.length;
        }
      }

      currentIndex = nextIndex;
      await renderMediaAtIndex(nextIndex);
    }

    function checkScheduleAndNext() {
      const isScheduled = document.getElementById('schedule-enable').checked;
      if (isScheduled && !isInActiveSchedule()) {
        document.getElementById('blackout-screen').style.display = 'block';
        resetTimer();
      } else {
        document.getElementById('blackout-screen').style.display = 'none';
        showNextPhoto();
      }
    }

    function isInActiveSchedule() {
      const now = new Date();
      const dayOfWeek = now.getDay();
      const currentMin = now.getHours() * 60 + now.getMinutes();
      const daySchedules = schedulesByDay[dayOfWeek] || [];

      return daySchedules.some(s => {
        const [sh, sm] = s.start.split(':').map(Number);
        const [eh, em] = s.end.split(':').map(Number);
        const startMin = sh * 60 + sm; const endMin = eh * 60 + em;
        return startMin <= endMin ? (currentMin >= startMin && currentMin < endMin) : (currentMin >= startMin || currentMin < endMin);
      });
    }

    function stopSlideshow() {
      if (timer) clearTimeout(timer);

      const container = document.getElementById('photo-container');
      if (container) {
        const videos = container.querySelectorAll('video');
        videos.forEach(v => {
          v.pause();
          v.muted = true;
          v.removeAttribute('src');
          v.load();
        });
        container.innerHTML = '';
      }

      if (currentObjectUrl) {
        URL.revokeObjectURL(currentObjectUrl);
        currentObjectUrl = null;
      }
      currentPlayingPhotoId = null;

      if (document.fullscreenElement) {
        if (document.exitFullscreen) {
          document.exitFullscreen().catch(err => {});
        }
      }

      document.getElementById('slideshow-screen').style.display = 'none';
      document.getElementById('blackout-screen').style.display = 'none';
      document.getElementById('setup-screen').style.display = 'flex';
    }
  </script>
